<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Muhammad Sohail — Software Developer · Laravel · Python · SaaS. Building practical software and intelligent systems.">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="50%"  stop-color="#0F1318"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Violet → Cyan accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#7C9CF6" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft radial glow behind text -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#1E2433" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Node graph motif clip -->
    <clipPath id="headerClip">
      <rect width="1200" height="280"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Soft center glow -->
  <ellipse cx="600" cy="140" rx="500" ry="160" fill="url(#glow)"/>

  <!-- ─── Subtle node-graph motif (top-center) ─── -->
  <!-- Very thin, low-opacity lines suggesting API/backend connections -->
  <g clip-path="url(#headerClip)" opacity="0.18" stroke="#A7B0BE" stroke-width="0.8" fill="none">
    <!-- Horizontal spine -->
    <line x1="490" y1="38" x2="710" y2="38"/>
    <!-- Branch lines -->
    <line x1="520" y1="38" x2="500" y2="22"/>
    <line x1="560" y1="38" x2="545" y2="18"/>
    <line x1="600" y1="38" x2="600" y2="16"/>
    <line x1="640" y1="38" x2="655" y2="18"/>
    <line x1="680" y1="38" x2="700" y2="22"/>
    <!-- Endpoint nodes (small circles) -->
    <circle cx="490" cy="38"  r="2.2" fill="#A7B0BE" stroke="none"/>
    <circle cx="710" cy="38"  r="2.2" fill="#A7B0BE" stroke="none"/>
    <circle cx="500" cy="22"  r="1.8" fill="#8B5CF6" stroke="none" opacity="0.7"/>
    <circle cx="545" cy="18"  r="1.8" fill="#8B5CF6" stroke="none" opacity="0.7"/>
    <circle cx="600" cy="16"  r="2.0" fill="#22D3EE" stroke="none" opacity="0.9"/>
    <circle cx="655" cy="18"  r="1.8" fill="#8B5CF6" stroke="none" opacity="0.7"/>
    <circle cx="700" cy="22"  r="1.8" fill="#8B5CF6" stroke="none" opacity="0.7"/>
    <circle cx="520" cy="38"  r="1.5" fill="#A7B0BE" stroke="none"/>
    <circle cx="560" cy="38"  r="1.5" fill="#A7B0BE" stroke="none"/>
    <circle cx="600" cy="38"  r="1.5" fill="#A7B0BE" stroke="none"/>
    <circle cx="640" cy="38"  r="1.5" fill="#A7B0BE" stroke="none"/>
    <circle cx="680" cy="38"  r="1.5" fill="#A7B0BE" stroke="none"/>
  </g>

  <!-- ─── Primary Name ─── -->
  <text
    x="600" y="138"
    text-anchor="middle"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#F5F2EA"
  >Muhammad Sohail</text>

  <!-- ─── Role tagline ─── -->
  <text
    x="600" y="172"
    text-anchor="middle"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="2.5"
    fill="#A7B0BE"
  >SOFTWARE DEVELOPER  ·  LARAVEL  ·  PYTHON  ·  SAAS</text>

  <!-- ─── Accent gradient line ─── -->
  <rect x="200" y="192" width="800" height="1.2" fill="url(#accentLine)" rx="1"/>

  <!-- ─── Supporting statement ─── -->
  <text
    x="600" y="226"
    text-anchor="middle"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-style="italic"
    font-weight="300"
    letter-spacing="0.4"
    fill="#6B7280"
  >Building practical software and intelligent systems.</text>
</svg>
